<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pengaturan Global & Bisnis - Arista Admin</title>
    <link rel="stylesheet" href="../assets/css/variables.css">
    <link rel="stylesheet" href="../assets/css/reset.css">
    <link rel="stylesheet" href="../assets/css/global.css">
    <link rel="stylesheet" href="../assets/css/typography.css">
    <link rel="stylesheet" href="../assets/css/utilities.css">
    <link rel="stylesheet" href="../assets/css/pages/admin-dashboard.css">
    <style>
        .form-container-company { background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05); padding: 32px; border-radius: 12px; max-width: 800px; margin-top: 20px; }
        .section-form-title { font-size: 15px; font-weight: 600; color: #007bff; margin: 28px 0 14px 0; border-bottom: 1px solid rgba(255,255,255,0.08); padding-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
        .section-form-title:first-of-type { margin-top: 0; }
        .form-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
        .input-custom-admin { width: 100%; padding: 12px; background: rgba(0,0,0,0.25); border: 1px solid rgba(255,255,255,0.1); color: #fff; border-radius: 6px; font-size: 14px; transition: border-color 0.2s; }
        .input-custom-admin:focus { border-color: #007bff; outline: none; }
    </style>
</head>
<body>
    <div class="noise-overlay"></div>
    <div class="dashboard-wrapper">

        <!-- Main Workspace -->
        <main class="dashboard-main">
            <header class="admin-header">
                <div class="header-title-area">
                    <h1>Pengaturan Profil & Fitur Bisnis</h1>
                    <p class="breadcrumb">Admin / Global Settings CMS</p>
                </div>
            </header>

            <section class="dashboard-content">
                <form id="companyCmsForm" class="form-container-company">
                    
                    <!-- 1. GLOBAL SETTINGS -->
                    <div class="section-form-title">1. Global Settings</div>
                    <div class="form-group-admin" style="margin-bottom: 16px;">
                        <label style="display:block; margin-bottom:8px; font-size:13px; color:rgba(255,255,255,0.7);">Slogan Utama Website (Tagline / Hero Text)</label>
                        <input type="text" id="compTagline" required class="input-custom-admin" placeholder="Contoh: Solusi Cetak Cepat & Berkualitas di Kairatu">
                    </div>

                    <!-- 2. CRUD CONTACT INFO -->
                    <div class="section-form-title">2. Contact Info</div>
                    <div class="form-grid-2">
                        <div class="form-group-admin">
                            <label style="display:block; margin-bottom:8px; font-size:13px; color:rgba(255,255,255,0.7);">Nomor WhatsApp Utama</label>
                            <input type="text" id="compWhatsapp" required class="input-custom-admin" placeholder="Contoh: 6282212345678">
                        </div>
                        <div class="form-group-admin">
                            <label style="display:block; margin-bottom:8px; font-size:13px; color:rgba(255,255,255,0.7);">Email Bisnis</label>
                            <input type="email" id="compEmail" required class="input-custom-admin" placeholder="Contoh: aristaprint@gmail.com">
                        </div>
                    </div>
                    <div class="form-group-admin" style="margin-bottom: 16px;">
                        <label style="display:block; margin-bottom:8px; font-size:13px; color:rgba(255,255,255,0.7);">Alamat Fisik Workshop / Toko</label>
                        <textarea id="compAddress" rows="2" required class="input-custom-admin" style="resize:none;" placeholder="Nama jalan, kecamatan, kabupaten..."></textarea>
                    </div>

                    <!-- 3. SOCIAL MEDIA CHANNELS -->
                    <div class="section-form-title">3. Social Media Link</div>
                    <div class="form-grid-2">
                        <div class="form-group-admin">
                            <label style="display:block; margin-bottom:8px; font-size:13px; color:rgba(255,255,255,0.7);">URL Instagram</label>
                            <input type="url" id="compInstagram" class="input-custom-admin" placeholder="Contoh: https://instagram.com/arista.print">
                        </div>
                        <div class="form-group-admin">
                            <label style="display:block; margin-bottom:8px; font-size:13px; color:rgba(255,255,255,0.7);">URL Facebook Page</label>
                            <input type="url" id="compFacebook" class="input-custom-admin" placeholder="Contoh: https://facebook.com/aristaprinting">
                        </div>
                    </div>

                    <!-- 4. BUSINESS HOURS -->
                    <div class="section-form-title">4. Business Hours (Jam Operasional)</div>
                    <div class="form-grid-2">
                        <div class="form-group-admin">
                            <label style="display:block; margin-bottom:8px; font-size:13px; color:rgba(255,255,255,0.7);">Hari Kerja</label>
                            <input type="text" id="compDays" required class="input-custom-admin" placeholder="Contoh: Senin - Sabtu (Minggu Tutup)">
                        </div>
                        <div class="form-group-admin">
                            <label style="display:block; margin-bottom:8px; font-size:13px; color:rgba(255,255,255,0.7);">Jam Kerja</label>
                            <input type="text" id="compHours" required class="input-custom-admin" placeholder="Contoh: 08:00 - 21:00 WIT">
                        </div>
                    </div>

                    <div style="margin-top: 32px;">
                        <button type="submit" class="btn btn-primary" style="padding: 12px 28px;"><span>Simpan Konfigurasi</span></button>
                    </div>
                </form>
            </section>
        </main>
    </div>

<!-- 1. CDN Supabase SDK JS (Wajib Paling Atas) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- 2. Core Configuration App -->
<script src="../assets/js/config.js"></script>

<!-- 3. Supabase Client Initializer -->
<script src="../assets/js/supabase.js"></script>

<!-- 4. Session Guard (Untuk mengamankan route sebelum UI dirender) -->
<script src="../assets/js/admin/session.js"></script>

<!-- 5. Main Framework & Page-Specific Logic (Contoh: login.js atau dashboard.js) -->
<script src="../assets/js/main.js"></script>
  <script src="../assets/js/admin/sidebar.js"></script> 
  !-- 4. BARU MASUKKAN ENGINE HELPER 17.3 INI -->
<script src="../assets/js/admin/crud-helper.js"></script>
<script src="../assets/js/admin/company.js"></script>

</body>
</html>
