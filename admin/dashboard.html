
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Arista Digital Printing</title>
    <link rel="stylesheet" href="../assets/css/variables.css">
    <link rel="stylesheet" href="../assets/css/reset.css">
    <link rel="stylesheet" href="../assets/css/global.css">
    <link rel="stylesheet" href="../assets/css/typography.css">
    <link rel="stylesheet" href="../assets/css/utilities.css">
    <link rel="stylesheet" href="../assets/css/pages/admin-dashboard.css">
</head>
<body>
    <div class="noise-overlay"></div>

    <div class="dashboard-wrapper">
        <aside class="admin-sidebar">
            <div class="sidebar-brand">
                ARISTA<span>.</span>
            </div>
            <nav class="sidebar-menu">

                    <span>Ringkasan</span>
                </a>
                <a href="products.html" class="menu-item">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path></svg>

                </a>
                <a href="services.html" class="menu-item">

                    <span>Layanan Utama</span>
                </a>
                <a href="settings.html" class="menu-item">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                    <span>Pengaturan</span>
                </a>
            </nav>
            <div class="sidebar-footer">
                <button id="btnAdminLogout" class="btn-logout">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                    <span>Keluar Sesi</span>
                </button>
            </div>
        </aside>

        <main class="admin-main">
            <header class="main-header">
                <div class="header-title-area">
                    <h1>Ringkasan Sistem</h1>
                    <p>Selamat datang kembali di pusat kendali data Arista.</p>
                </div>
                <div class="user-profile-badge">
                    <div class="profile-avatar" id="avatarInitial">A</div>
                    <div class="profile-info">
                        <span class="profile-email" id="adminUserEmail">Mencari sesi...</span>
                    </div>
                </div>
            </header>

            <section class="dashboard-content">
                <div class="stats-grid">
                    <div class="stats-card">
                        <div class="stats-card-header">
                            <span class="card-label">Total Produk Konten</span>
                        </div>
                        <div class="stats-value" id="countProducts">-</div>
                    </div>
                    <div class="stats-card">
                        <div class="stats-card-header">
                            <span class="card-label">Total Layanan Aktif</span>
                        </div>
                        <div class="stats-value" id="countServices">-</div>
                    </div>
                    <div class="stats-card">
                        <div class="stats-card-header">
                            <span class="card-label">Versi Infrastruktur</span>
                        </div>
                        <div class="stats-value" id="coreVersion">1.0.0</div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    
    <script src="../assets/js/config.js"></script>
    <script src="../assets/js/admin/session.js"></script>
    <script src="../assets/js/admin/dashboard.js"></script>

</html>
