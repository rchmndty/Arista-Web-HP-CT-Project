
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Arista Digital Printing</title>
    <link rel="stylesheet" href="../assets/css/variables.css">
    <link rel="stylesheet" href="../assets/css/reset.css">
    <link rel="stylesheet" href="../assets/css/global.css">
    <link rel="stylesheet" href="../assets/css/typography.css">
    <link rel="stylesheet" href="../assets/css/utilities.css">
    <link rel="stylesheet" href="../assets/css/pages/admin-dashboard.css">
</head>
<body>
    <div class="noise-overlay"></div>

    <div class="dashboard-wrapper">
      
        <main class="admin-main">
            <header class="main-header">
                <div class="header-title-area">
                    <h1>Ringkasan Sistem</h1>
                    <p>Selamat datang kembali di pusat kendali data Arista.</p>
                </div>
                <div class="user-profile-badge">
                    <div class="profile-avatar" id="avatarInitial">A</div>
                    <div class="profile-info">
                        <span class="profile-email" id="adminUserEmail">Mencari sesi...</span>
                    </div>
                </div>
            </header>

            <section class="dashboard-content">
                <div class="stats-grid">
                    <div class="stats-card">
                        <div class="stats-card-header">
                            <span class="card-label">Total Produk Konten</span>
                        </div>
                        <div class="stats-value" id="countProducts">-</div>
                    </div>
                    <div class="stats-card">
                        <div class="stats-card-header">
                            <span class="card-label">Total Layanan Aktif</span>
                        </div>
                        <div class="stats-value" id="countServices">-</div>
                    </div>
                    <div class="stats-card">
                        <div class="stats-card-header">
                            <span class="card-label">Versi Infrastruktur</span>
                        </div>
                        <div class="stats-value" id="coreVersion">1.0.0</div>
                    </div>
                </div>
            </section>
        </main>
    </div>

<!-- 1. CDN Supabase SDK JS (Wajib Paling Atas) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- 2. Core Configuration App -->
<script src="../assets/js/config.js"></script>

<!-- 3. Supabase Client Initializer -->
<script src="../assets/js/supabase.js"></script>

<!-- 4. Session Guard (Untuk mengamankan route sebelum UI dirender) -->
<script src="../assets/js/admin/session.js"></script>

<!-- 5. Main Framework & Page-Specific Logic (Contoh: login.js atau dashboard.js) -->
<script src="../assets/js/main.js"></script>
<script src="../assets/js/admin/sidebar.js"></script> 
  !-- 4. BARU MASUKKAN ENGINE HELPER 17.3 INI -->
<script src="../assets/js/admin/crud-helper.js"></script>
  <script src="../assets/js/admin/dashboard.js"></script>

</body>
</html>
