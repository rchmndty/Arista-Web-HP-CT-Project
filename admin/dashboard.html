
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Arista Digital Printing</title>
    <link rel="stylesheet" href="../assets/css/variables.css">
    <link rel="stylesheet" href="../assets/css/reset.css">
    <link rel="stylesheet" href="../assets/css/global.css">
    <link rel="stylesheet" href="../assets/css/typography.css">
    <link rel="stylesheet" href="../assets/css/utilities.css">
    <link rel="stylesheet" href="../assets/css/pages/admin-dashboard.css">
</head>
<body>
    <div class="noise-overlay"></div>

    <div class="dashboard-wrapper">
      
        <main class="admin-main">
            <header class="main-header">
                <div class="header-title-area">
                    <h1>Ringkasan Sistem</h1>
                    <p>Selamat datang kembali di pusat kendali data Arista.</p>
                </div>
                <div class="user-profile-badge">
                    <div class="profile-avatar" id="avatarInitial">A</div>
                    <div class="profile-info">
                        <span class="profile-email" id="adminUserEmail">Mencari sesi...</span>
                    </div>
                </div>
            </header>

            <section class="dashboard-content">
                <div class="stats-grid">
                    <div class="stats-card">
                        <div class="stats-card-header">
                            <span class="card-label">Total Produk Konten</span>
                        </div>
                        <div class="stats-value" id="countProducts">-</div>
                    </div>
                    <div class="stats-card">
                        <div class="stats-card-header">
                            <span class="card-label">Total Layanan Aktif</span>
                        </div>
                        <div class="stats-value" id="countServices">-</div>
                    </div>
                    <div class="stats-card">
                        <div class="stats-card-header">
                            <span class="card-label">Versi Infrastruktur</span>
                        </div>
                        <div class="stats-value" id="coreVersion">1.0.0</div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    
    <script src="../assets/js/config.js"></script>
    <script src="../assets/js/admin/session.js"></script>
    <script src="../assets/js/admin/dashboard.js"></script>
      <!-- ... batas akhir form modal atau konten workspace ... -->
    
    <script src="../assets/js/config.js"></script>
    <script src="../assets/js/admin/session.js"></script>
    <!-- Tambahkan panggil script terpusat ini di atas script engine bawaan page -->
    <script src="../assets/js/admin/sidebar.js"></script> 
    <script src="../assets/js/admin/services.js"></script> <!-- Atau faq.js / testimonials.js -->
</body>
</html>

</body>
</html>
