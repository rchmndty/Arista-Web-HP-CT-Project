<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manajemen FAQ - Arista Admin</title>
    <link rel="stylesheet" href="../assets/css/variables.css">
    <link rel="stylesheet" href="../assets/css/reset.css">
    <link rel="stylesheet" href="../assets/css/global.css">
    <link rel="stylesheet" href="../assets/css/typography.css">
    <link rel="stylesheet" href="../assets/css/utilities.css">
    <link rel="stylesheet" href="../assets/css/pages/admin-dashboard.css">
    <link rel="stylesheet" href="../assets/css/pages/admin-services.css">
</head>
<body>
    <div class="noise-overlay"></div>
    <div class="dashboard-wrapper">

        <!-- Main Workspace -->
        <main class="dashboard-main">
            <header class="admin-header">
                <div class="header-title-area">
                    <h1>Manajemen Tanya Jawab (FAQ)</h1>
                    <p class="breadcrumb">Admin / FAQ CMS</p>
                </div>
                <div class="header-action">
                    <button class="btn btn-primary" id="openAddModalBtn"><span>+ Tambah FAQ</span></button>
                </div>
            </header>

            <section class="dashboard-content">
                <!-- Grid list FAQ -->
                <div class="services-list-grid" id="faqCmsGrid">
                    <div class="loading-state-cms">Memuat data tanya jawab...</div>
                </div>
            </section>
        </main>
    </div>

    <!-- Modal Form FAQ -->
    <div class="cms-modal-overlay" id="faqModal">
        <div class="cms-modal-card">
            <div class="modal-card-header">
                <h3 id="modalTitle">Tambah FAQ Baru</h3>
                <button class="close-modal-btn" id="closeModalBtn">&times;</button>
            </div>
            <form id="faqForm" class="modal-card-body">
                <input type="hidden" id="faqId">
                <div class="form-group-admin">
                    <label for="faqQuestion">Pertanyaan (Question)</label>
                    <input type="text" id="faqQuestion" required placeholder="Contoh: Berapa lama durasi cetak banner?">
                </div>
                <div class="form-group-admin">
                    <label for="faqAnswer">Jawaban (Answer)</label>
                    <textarea id="faqAnswer" rows="4" required placeholder="Jelaskan jawaban secara detail dan informatif..."></textarea>
                </div>
                <div class="modal-card-footer">
                    <button type="button" class="btn-cancel" id="cancelModalBtn">Batal</button>
                    <button type="submit" class="btn btn-primary"><span>Simpan Data</span></button>
                </div>
            </form>
        </div>
    </div>

    <script src="../assets/js/config.js"></script>
    <script src="../assets/js/admin/session.js"></script>
    <script src="../assets/js/admin/faq.js"></script>
      <!-- ... batas akhir form modal atau konten workspace ... -->
    
    <script src="../assets/js/config.js"></script>
    <script src="../assets/js/admin/session.js"></script>
    <!-- Tambahkan panggil script terpusat ini di atas script engine bawaan page -->
    <script src="../assets/js/admin/sidebar.js"></script> 
    <script src="../assets/js/admin/services.js"></script> <!-- Atau faq.js / testimonials.js -->
</body>
</html>

</body>
</html>
