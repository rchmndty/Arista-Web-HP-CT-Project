<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manajemen Beranda - Arista Admin</title>
    <link rel="stylesheet" href="../assets/css/variables.css">
    <link rel="stylesheet" href="../assets/css/reset.css">
    <link rel="stylesheet" href="../assets/css/global.css">
    <link rel="stylesheet" href="../assets/css/typography.css">
    <link rel="stylesheet" href="../assets/css/utilities.css">
    <link rel="stylesheet" href="../assets/css/pages/admin-dashboard.css">
    <link rel="stylesheet" href="../assets/css/pages/admin-homepage.css">
</head>
<body>
    <div class="noise-overlay"></div>

    <div class="dashboard-wrapper">
      
        <main class="dashboard-main">
            <header class="admin-header">
                <div class="header-title-area">
                    <h1>Manajemen Konten Beranda</h1>
                    <p class="breadcrumb">Admin / Konten Beranda</p>
                </div>
                <div class="header-action">
                    <button type="submit" form="homepageCmsForm" class="btn btn-primary" id="saveBtn">
                        <span>Simpan Perubahan</span>
                    </button>
                </div>
            </header>

            <section class="dashboard-content">
                <form id="homepageCmsForm" class="cms-grid-layout">
                    
                    <div class="cms-forms-column">
                        
                        <div class="cms-card">
                            <div class="cms-card-header">
                                <span class="cms-card-icon">✨</span>
                                <h3>Kustomisasi Hero Section</h3>
                            </div>
                            <div class="cms-card-body">
                                <div class="form-group-admin">
                                    <label for="heroHeadline">Headline Utama</label>
                                    <input type="text" id="heroHeadline" required minlength="10" placeholder="Masukkan headline utama...">
                                </div>
                                <div class="form-group-admin">
                                    <label for="heroSubheadline">Sub-Headline</label>
                                    <textarea id="heroSubheadline" rows="3" required minlength="20" placeholder="Masukkan deskripsi sub-headline..."></textarea>
                                </div>
                                <div class="form-row-admin">
                                    <div class="form-group-admin">
                                        <label for="heroCtaPrimaryText">Teks Tombol Utama</label>
                                        <input type="text" id="heroCtaPrimaryText" required placeholder="Contoh: Lihat Katalog">
                                    </div>
                                    <div class="form-group-admin">
                                        <label for="heroCtaPrimaryUrl">Link URL Utama</label>
                                        <input type="text" id="heroCtaPrimaryUrl" required placeholder="Contoh: catalog.html">
                                    </div>
                                </div>
                                <div class="form-row-admin">
                                    <div class="form-group-admin">
                                        <label for="heroCtaSecondaryText">Teks Tombol Sekunder</label>
                                        <input type="text" id="heroCtaSecondaryText" required placeholder="Contoh: Hubungi Kami">
                                    </div>
                                    <div class="form-group-admin">
                                        <label for="heroCtaSecondaryUrl">Link URL Sekunder</label>
                                        <input type="text" id="heroCtaSecondaryUrl" required placeholder="Contoh: contact.html">
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="cms-card">
                            <div class="cms-card-header">
                                <span class="cms-card-icon">🏢</span>
                                <h3>Kustomisasi About Section</h3>
                            </div>
                            <div class="cms-card-body">
                                <div class="form-group-admin">
                                    <label for="aboutBadge">Teks Badge Intro</label>
                                    <input type="text" id="aboutBadge" required placeholder="Contoh: ✨ Tentang Arista">
                                </div>
                                <div class="form-group-admin">
                                    <label for="aboutTitle">Judul Utama Tentang Kami</label>
                                    <input type="text" id="aboutTitle" required minlength="10" placeholder="Masukkan judul tentang kami...">
                                </div>
                                <div class="form-group-admin">
                                    <label for="aboutDesc">Narasi/Deskripsi Panjang</label>
                                    <textarea id="aboutDesc" rows="4" required minlength="30" placeholder="Masukkan deskripsi detail perusahaan..."></textarea>
                                </div>
                                <div class="form-group-admin">
                                    <label for="aboutVision">Visi Utama</label>
                                    <textarea id="aboutVision" rows="2" required placeholder="Tulis visi perusahaan..."></textarea>
                                </div>

                                <div class="form-group-admin">
                                    <label>Daftar Poin Misi</label>
                                    <div id="missionListContainer" class="dynamic-list-admin">
                                        </div>
                                    <button type="button" id="addMissionBtn" class="btn-add-item">
                                        + Tambah Poin Misi Baru
                                    </button>
                                </div>
                            </div>
                        </div>

                    </div>

                    <div class="cms-preview-column">
                        <div class="sticky-preview-wrapper">
                            <div class="cms-card preview-card">
                                <div class="cms-card-header">
                                    <span class="cms-card-icon">👁️</span>
                                    <h3>Live Layout Preview</h3>
                                    <span class="preview-badge">Simulasi Real-time</span>
                                </div>
                                <div class="cms-card-body">
                                    <div class="mock-website-frame">
                                        <div class="mock-section-hero">
                                            <span class="mock-badge">✨ Premium Printing Solution</span>
                                            <h1 class="mock-headline" id="prevHeroHeadline">-</h1>
                                            <p class="mock-subheadline" id="prevHeroSubheadline">-</p>
                                            <div class="mock-cta-group">
                                                <span class="mock-btn btn-p" id="prevHeroCtaPrimary">-</span>
                                                <span class="mock-btn btn-s" id="prevHeroCtaSecondary">-</span>
                                            </div>
                                        </div>
                                        <hr class="mock-divider">
                                        <div class="mock-section-about">
                                            <span class="mock-badge" id="prevAboutBadge">-</span>
                                            <h2 class="mock-title" id="prevAboutTitle">-</h2>
                                            <p class="mock-desc" id="prevAboutDesc">-</p>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                </form>
            </section>
        </main>
    </div>


<!-- 1. CDN Supabase SDK JS (Wajib Paling Atas) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- 2. Core Configuration App -->
<script src="../assets/js/config.js"></script>

<!-- 3. Supabase Client Initializer -->
<script src="../assets/js/supabase.js"></script>

<!-- 4. Session Guard (Untuk mengamankan route sebelum UI dirender) -->
<script src="../assets/js/admin/session.js"></script>

<!-- 5. Main Framework & Page-Specific Logic (Contoh: login.js atau dashboard.js) -->
<script src="../assets/js/main.js"></script>
<script src="../assets/js/admin/sidebar.js"></script> 
  !-- 4. BARU MASUKKAN ENGINE HELPER 17.3 INI -->
<script src="../assets/js/admin/crud-helper.js"></script>
  <script src="../assets/js/admin/homepage.js"></script>

</body>
</html>
