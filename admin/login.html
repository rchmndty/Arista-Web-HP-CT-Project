
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Arista Digital Printing</title>
    <link rel="stylesheet" href="../assets/css/variables.css">
    <link rel="stylesheet" href="../assets/css/reset.css">
    <link rel="stylesheet" href="../assets/css/global.css">
    <link rel="stylesheet" href="../assets/css/typography.css">
    <link rel="stylesheet" href="../assets/css/utilities.css">
    <link rel="stylesheet" href="../assets/css/pages/admin-login.css">
</head>
<body>
    <div class="noise-overlay"></div>

    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="login-logo">ARISTA<span>.</span></div>
                <p class="login-subtitle">Panel Kendali Manajemen Konten</p>
            </div>
            
            <form id="adminLoginForm" class="login-form">
                <div class="form-group">
                    <label for="loginEmail">Email Administrator</label>
                    <input type="email" id="loginEmail" required placeholder="nama@aristaprint.com" autocomplete="email">
                </div>
                
                <div class="form-group">
                    <label for="loginPassword">Kata Sandi</label>
                    <input type="password" id="loginPassword" required placeholder="••••••••" autocomplete="current-password">
                </div>

                <div id="loginErrorMessage" class="login-error-message text-danger hidden"></div>
                
                <button type="submit" id="btnAuthSubmit" class="btn-login">
                    <span class="btn-text">Masuk ke Products CMS</span>
                    <div class="btn-loader hidden"></div>
                </button>
            </form>
        </div>
    </div>

<!-- 1. CDN Supabase SDK JS (Wajib Paling Atas) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- 2. Core Configuration App -->
<script src="../assets/js/config.js"></script>

<!-- 3. Supabase Client Initializer -->
<script src="../assets/js/supabase.js"></script>

<!-- 4. Session Guard (Tutup komentar dengan benar) -->
<!-- <script src="../assets/js/admin/session.js"></script> -->

<!-- 5. Main Framework & Page-Specific Logic (Tag penutup </script> sudah diperbaiki) -->
<script src="../assets/js/main.js"></script>
<script src="../assets/js/admin/crud-helper.js"></script>
<script src="../assets/js/admin/login.js"></script>


</body>
</html>
