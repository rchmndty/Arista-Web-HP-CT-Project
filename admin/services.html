<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manajemen Layanan - Arista Admin</title>
    <link rel="stylesheet" href="../assets/css/variables.css">
    <link rel="stylesheet" href="../assets/css/reset.css">
    <link rel="stylesheet" href="../assets/css/global.css">
    <link rel="stylesheet" href="../assets/css/typography.css">
    <link rel="stylesheet" href="../assets/css/utilities.css">
    <link rel="stylesheet" href="../assets/css/pages/admin-dashboard.css">
    <link rel="stylesheet" href="../assets/css/pages/admin-services.css">
</head>
<body>
    <div class="noise-overlay"></div>
    <div class="dashboard-wrapper">
        

        <main class="dashboard-main">
            <header class="admin-header">
                <div class="header-title-area">
                    <h1>Manajemen Layanan Utama</h1>
                    <p class="breadcrumb">Admin / Layanan CMS</p>
                </div>
                <div class="header-action">
                    <button class="btn btn-primary" id="openAddModalBtn"><span>+ Tambah Layanan</span></button>
                </div>
            </header>

            <section class="dashboard-content">
                <div class="services-list-grid" id="servicesCmsGrid">
                    <div class="loading-state-cms">Memuat data penyimpanan layanan lokal...</div>
                </div>
            </section>
        </main>
    </div>

    <div class="cms-modal-overlay" id="serviceModal">
        <div class="cms-modal-card">
            <div class="modal-card-header">
                <h3 id="modalTitle">Tambah Layanan Baru</h3>
                <button class="close-modal-btn" id="closeModalBtn">&times;</button>
            </div>
            <form id="serviceForm" class="modal-card-body">
                <input type="hidden" id="serviceId">
                <div class="form-group-admin">
                    <label for="serviceName">Nama Layanan</label>
                    <input type="text" id="serviceName" required placeholder="Contoh: Express Printing 24 Jam">
                </div>
                <div class="form-group-admin">
                    <label for="serviceIcon">Icon (Lucide / SVG Slug Keyword)</label>
                    <input type="text" id="serviceIcon" required placeholder="Contoh: printer, zap, Layers, image">
                </div>
                <div class="form-group-admin">
                    <label for="serviceDesc">Deskripsi Ringkas Layanan</label>
                    <textarea id="serviceDesc" rows="3" required placeholder="Jelaskan keunggulan layanan ini secara singkat..."></textarea>
                </div>
                <div class="modal-card-footer">
                    <button type="button" class="btn-cancel" id="cancelModalBtn">Batal</button>
                    <button type="submit" class="btn btn-primary"><span>Simpan Data</span></button>
                </div>
            </form>
        </div>
    </div>

    <script src="../assets/js/config.js"></script>
    <script src="../assets/js/admin/session.js"></script>
    <script src="../assets/js/admin/services.js"></script>
      <!-- ... batas akhir form modal atau konten workspace ... -->
    
    <script src="../assets/js/config.js"></script>
    <script src="../assets/js/admin/session.js"></script>
    <!-- Tambahkan panggil script terpusat ini di atas script engine bawaan page -->
    <script src="../assets/js/admin/sidebar.js"></script> 
    <script src="../assets/js/admin/services.js"></script> <!-- Atau faq.js / testimonials.js -->
</body>
</html>
