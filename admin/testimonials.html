<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manajemen Testimonial - Arista Admin</title>
    <link rel="stylesheet" href="../assets/css/variables.css">
    <link rel="stylesheet" href="../assets/css/reset.css">
    <link rel="stylesheet" href="../assets/css/global.css">
    <link rel="stylesheet" href="../assets/css/typography.css">
    <link rel="stylesheet" href="../assets/css/utilities.css">
    <link rel="stylesheet" href="../assets/css/pages/admin-dashboard.css">
    <link rel="stylesheet" href="../assets/css/pages/admin-services.css">
</head>
<body>
    <div class="noise-overlay"></div>
    <div class="dashboard-wrapper">
        <!-- Main Workspace -->
        <main class="dashboard-main">
            <header class="admin-header">
                <div class="header-title-area">
                    <h1>Testimonial Pelanggan</h1>
                    <p class="breadcrumb">Admin / Review CMS</p>
                </div>
                <div class="header-action">
                    <button class="btn btn-primary" id="openAddModalBtn"><span>+ Tambah Review</span></button>
                </div>
            </header>

            <section class="dashboard-content">
                <div class="services-list-grid" id="testimonialCmsGrid">
                    <div class="loading-state-cms">Memuat data ulasan...</div>
                </div>
            </section>
        </main>
    </div>

    <!-- Modal Form CRUD Testimonial -->
    <div class="cms-modal-overlay" id="testimonialModal">
        <div class="cms-modal-card">
            <div class="modal-card-header">
                <h3 id="modalTitle">Tambah Testimonial</h3>
                <button class="close-modal-btn" id="closeModalBtn">&times;</button>
            </div>
            <form id="testimonialForm" class="modal-card-body">
                <input type="hidden" id="testiId">
                <div class="form-group-admin">
                    <label for="testiName">Nama Pelanggan</label>
                    <input type="text" id="testiName" required placeholder="Contoh: Budi Santoso">
                </div>
                <div class="form-group-admin">
                    <label for="testiRole">Pekerjaan / Instansi</label>
                    <input type="text" id="testiRole" required placeholder="Contoh: Mahasiswa Unpatti / Pemilik UMKM">
                </div>
                <div class="form-group-admin">
                    <label for="testiMessage">Isi Ulasan / Testimonial</label>
                    <textarea id="testiMessage" rows="4" required placeholder="Tulis testimoni pelanggan di sini..."></textarea>
                </div>
                <div class="modal-card-footer">
                    <button type="button" class="btn-cancel" id="cancelModalBtn">Batal</button>
                    <button type="submit" class="btn btn-primary"><span>Simpan Data</span></button>
                </div>
            </form>
        </div>
    </div>

<!-- 1. Pemasangan Pustaka SDK Supabase Utama (WAJIB ADA) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

  <script src="../assets/js/admin/session.js"></script>


<!-- 2. Pemasangan Konfigurasi & Inisialisasi Konektor -->
<script src="../assets/js/config.js"></script>
<script src="../assets/js/supabase.js"></script>

<!-- 3. Mesin Pengaman Sesi (WAJIB DIBAWAH SDK SUPABASE) -->

<!-- 4. Script Khusus Halaman (Ganti dengan file JS halaman terkait) -->
<script src="../assets/js/admin/sidebar.js"></script> 
<script src="../assets/js/admin/testimonials.js"></script> <!-- Sesuaikan dengan nama halaman -->

</body>
</html>
